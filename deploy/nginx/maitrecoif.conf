# nginx (hôte) — Maitre Coif. À copier en /etc/nginx/sites-available/maitrecoif.conf puis :
#   sudo ln -s /etc/nginx/sites-available/maitrecoif.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Isolation : ce fichier ne déclare que les noms de domaine de Maitre Coif ; l'autre application garde ses
# propres blocs « server ». Aucune directive globale (http) n'est modifiée. Adaptez maitrecoif.com si besoin.
# « listen ... ssl http2 » (et non « http2 on; ») : compatible avec les nginx antérieurs à 1.25 et avec les autres sites du serveur.
#
# Cloudflare est devant le serveur : les adresses des visiteurs viennent de l'en-tête CF-Connecting-IP
# (valable uniquement pour les connexions venant de Cloudflare, cf. cloudflare-realip.conf).

upstream maitrecoif_app {
    server 127.0.0.1:3101;   # APP_PORT du fichier .env de Docker Compose
    keepalive 16;
}

# HTTP -> HTTPS (Cloudflare fait déjà la redirection côté visiteur ; ceci couvre l'accès direct)
server {
    listen 80;
    listen [::]:80;
    server_name maitrecoif.com www.maitrecoif.com salon.maitrecoif.com;
    return 301 https://$host$request_uri;
}

# www -> domaine principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.maitrecoif.com;

    ssl_certificate     /etc/ssl/maitrecoif/origin.pem;
    ssl_certificate_key /etc/ssl/maitrecoif/origin.key;

    return 301 https://maitrecoif.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maitrecoif.com salon.maitrecoif.com;

    # Certificat d'origine Cloudflare (SSL « Full (strict) ») : voir deploy/README.md
    ssl_certificate     /etc/ssl/maitrecoif/origin.pem;
    ssl_certificate_key /etc/ssl/maitrecoif/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:maitrecoif_ssl:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/maitrecoif.access.log;
    error_log  /var/log/nginx/maitrecoif.error.log warn;

    # Envois de photos (produits, galerie) : le site limite lui-même la taille ; marge pour l'encodage.
    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Fichiers versionnés de Next.js : cache d'un an, sans repasser par Node
    location /_next/static/ {
        proxy_pass http://maitrecoif_app;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://maitrecoif_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # Adresse réelle du visiteur (restaurée depuis CF-Connecting-IP) : le site s'en sert pour limiter les abus.
        # L'en-tête Vercel est vidé : un visiteur ne doit pas pouvoir choisir lui-même son adresse.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Vercel-Forwarded-For "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
